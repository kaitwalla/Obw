services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - obw-mongo:/data/db

  obw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FUNCTIOUS_REF: ${FUNCTIOUS_REF:-5672a5bc7dc361df8e85b01e0aca515da821099d}
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      TOKEN: ${TOKEN}
      MONGODB: ${MONGODB:-mongodb://mongo:27017/obw}
      SENTRY_DSN: ${SENTRY_DSN:-}
      BOTID: ${BOTID:-}
      CDN: ${CDN:-https://example.com}
      CDN_KEY: ${CDN_KEY:-}
      API_PORT: ${API_PORT:-8889}
      API_KEY: ${API_KEY:-}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost:3000}
      FLUXER_CLIENT_ID: ${FLUXER_CLIENT_ID:-}
      FLUXER_CLIENT_SECRET: ${FLUXER_CLIENT_SECRET:-}
      FLUXER_REDIRECT_URI: ${FLUXER_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
    ports:
      - "${API_PORT:-8889}:${API_PORT:-8889}"

volumes:
  obw-mongo:
